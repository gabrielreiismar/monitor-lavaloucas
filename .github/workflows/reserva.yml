name: Reserva na nuvem

# Turno longo: um job fica ~5h45 varrendo as lojas no ritmo do config (30 min na Black Friday),
# e no fim dispara o próximo turno sozinho. O cron abaixo é só vigia: religa a corrente se ela quebrar.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Varrer mesmo com o Mac vivo (teste)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: reserva
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAC_HEARTBEAT: ${{ vars.MAC_HEARTBEAT }}
      FORCE: ${{ github.event.inputs.force }}
      NO_HEARTBEAT: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decidir se roda
        id: gate
        run: python run.py --gate
      - name: Histórico de preços (cache)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/precos.sqlite
          key: db-${{ github.run_id }}
          restore-keys: db-
      - name: Instalar Chromium
        if: steps.gate.outputs.run == 'true'
        run: playwright install --with-deps chromium
      - name: Varrer em loop (turno de ~5h45)
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p data && python run.py --loop --max-minutes 335
      - name: Publicar histórico de preços (branch historico)
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          mkdir -p /tmp/h && python export_history.py /tmp/h/precos.csv
          cd /tmp/h && git init -q -b historico
          git config user.name "robo" && git config user.email "robo@users.noreply.github.com"
          git add precos.csv && git commit -q -m "histórico $(date -u +%F\ %H:%M)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" historico
      - name: Disparar o próximo turno
        if: steps.gate.outputs.run == 'true' && always()
        run: gh workflow run reserva.yml --ref main -f force=1
